name: release

# Builds the tile tool (tools/tile_palettes) for Windows and Linux, and with it a bundle per
# system: this repository's files, with the tool already in dev/. Then builds the example from each
# bundle, as someone who downloaded it would.
#
# On a version tag (v0.1.0), publishes the bundles as that release. llvm-mos isn't in them: the
# first build downloads it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            system: windows
            target: x86_64-pc-windows-msvc
            program: tile_palettes.exe
          - os: ubuntu-latest
            system: linux
            target: x86_64-unknown-linux-musl
            program: tile_palettes
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install the musl target and Ninja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools ninja-build
          rustup target add ${{ matrix.target }}

      - name: Install Ninja
        if: runner.os == 'Windows'
        run: ninja --version || choco install ninja -y

      # Statically linked, so the Windows build doesn't need the Visual C++ runtime, and the Linux
      # build (musl) runs on any distribution.
      - name: Build the tile tool
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path tools/tile_palettes/Cargo.toml

      # gametank-llvm-mos-<version>-<system>: the repository's files (but the workflows), with the
      # tile tool in dev/tile_palettes.
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          bundle="out/bundle/gametank-llvm-mos"
          mkdir -p "$bundle/dev/tile_palettes"
          git ls-files -z -- . ':(exclude).github' | xargs -0 cp --parents -t "$bundle"
          cp "tools/tile_palettes/target/${{ matrix.target }}/release/${{ matrix.program }}" "$bundle/dev/tile_palettes/"
          cd out
          if [ "$RUNNER_OS" = Windows ]; then
            (cd bundle && 7z a "../gametank-llvm-mos-$version-windows-x86_64.zip" gametank-llvm-mos)
          else
            tar -czf "gametank-llvm-mos-$version-linux-x86_64.tar.gz" -C bundle gametank-llvm-mos
          fi

      # From the bundle, as a download: unpacked somewhere else, with nothing else installed but
      # what README.md says.
      - name: Build the example from the bundle (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir ../unpacked
          7z x -o../unpacked out/gametank-llvm-mos-*-windows-x86_64.zip
          cmd //c "..\\unpacked\\gametank-llvm-mos\\example\\build.bat"
          roms=(../unpacked/gametank-llvm-mos/example/build/*.gtr)
          test -s "${roms[0]}"

      - name: Build the example from the bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir ../unpacked
          tar -xzf out/gametank-llvm-mos-*-linux-x86_64.tar.gz -C ../unpacked
          ../unpacked/gametank-llvm-mos/example/build.sh
          roms=(../unpacked/gametank-llvm-mos/example/build/*.gtr)
          test -s "${roms[0]}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.system }}
          path: |
            out/*.zip
            out/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      # The release notes are the tag's message: git tag -a v0.2 -m "What changed". (Read from
      # GitHub, as this job has no checkout.)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_object=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq '.object | select(.type == "tag") | .sha')
          if [ -z "$tag_object" ]; then
            echo "::error::$GITHUB_REF_NAME has no message for the release notes: tag with git tag -a"
            exit 1
          fi
          gh api "repos/$GH_REPO/git/tags/$tag_object" --jq .message > notes.txt
          # A tag pushed again replaces its release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" out/* --title "gametank-llvm-mos $GITHUB_REF_NAME" --notes-file notes.txt
